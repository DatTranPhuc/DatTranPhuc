name: Generate 3D contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latestt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
